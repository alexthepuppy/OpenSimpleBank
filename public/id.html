<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OSB - Identity</title>

        <script src="/common/utils.js"></script>
    </head>
    <body>
        <div class="box">
            <h3>User Information</h3>
            <p id="status"></p>
            <form id="identity">
                <p>Username: <input name="username"></p>
                <p>Password: <input name="password"></p>
            </form>
            <p>
                <button onclick="login()">Login</button>
                <button onclick="signup()">Signup</button>
            </p>
        </div>
    </body>

    <script>
        function getInputs() {
            const form = document.getElementById('identity');
            const username = form.querySelector('[name=username]').value;
            const password = form.querySelector('[name=password]').value;
            return {username:username, password:password}
        }

        function updateStatus(message) {
            document.getElementById('status').innerText = message;
        }

        function login() {
            makePOSTRequest('account/login/', getInputs()).then(() => {
                updateStatus("Logged in!");
            }).catch(() => {
                updateStatus("Failed to login!");
            });
        }

        function signup() {
            makePOSTRequest('account/signup/', getInputs()).then(() => {
                updateStatus("Account created");
            }).catch(() => {
                updateStatus("Failed to signup!");
            });
        }

    </script>

</html>
